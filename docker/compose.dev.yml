# ============================================================
# Bhavya Foundation — Development Docker Compose
# Usage: docker compose -f docker/compose.dev.yml up
# ============================================================

version: "3.9"

services:
  website:
    build:
      context: .
      dockerfile: docker/Dockerfile.website
      args:
        - NODE_ENV=development
    container_name: bhavya-website-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./apps/website:/app/apps/website
      - ./packages:/app/packages
      - ./config:/app/config
      - ./registry:/app/registry
      - ./content:/app/content
      - ./navigation:/app/navigation
      - ./memory:/app/memory
      - /app/node_modules
      - /app/apps/website/node_modules
    restart: unless-stopped
    networks:
      - bhavya-dev-net

  runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        - NODE_ENV=development
    container_name: bhavya-runtime-dev
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
    env_file:
      - .env
    volumes:
      - ./packages/mission-runtime:/app/packages/mission-runtime
      - ./config:/app/config
      - ./registry:/app/registry
      - ./content:/app/content
      - ./navigation:/app/navigation
      - ./memory:/app/memory
      - /app/node_modules
    restart: unless-stopped
    networks:
      - bhavya-dev-net

networks:
  bhavya-dev-net:
    driver: bridge
