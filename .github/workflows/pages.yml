name: Deploy to GitHub Pages

# Publishes only the static assets in apps/ai-institute/public (images, SVGs,
# manifests). This is NOT the application: the canonical app deploys to
# Cloudflare/OpenNext via deploy-cloudflare.yml.
#
# Previous trigger included the personal branch 'feat/immersive-hero-background',
# which meant a feature branch could publish to the public Pages URL. Only the
# integration branch may publish.
on:
  push:
    branches: [master]
    paths:
      - 'apps/ai-institute/public/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/ai-institute/public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4