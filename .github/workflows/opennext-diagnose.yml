name: OpenNext Install Deps Diagnose

# DIAGNOSIS ONLY. Never deploys. Never uses Cloudflare credentials.
# This workflow exists to answer one question with filesystem evidence:
# does .open-next/server-functions/default/node_modules/ contain a flat
# @libsql/* tree, a pnpm store, or broken symlinks, and does that tree exist
# before esbuild runs?
#
# It does NOT change the canonical deploy workflow.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/opennext-diagnose.yml"
      - "scripts/opennext-diagnose.mjs"

permissions:
  contents: read

concurrency:
  group: opennext-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose server-function dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddb

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js application build
        run: pnpm --filter ai-institute run build

      # Runs the exact production-equivalent build command, then inspects the
      # output tree. The build is expected to FAIL; the diagnosis is the output,
      # not the exit code.
      - name: Run OpenNext build and diagnose output tree
        working-directory: apps/ai-institute
        continue-on-error: true
        run: node ../../scripts/opennext-diagnose.mjs

      - name: Write findings to job summary
        if: always()
        run: node scripts/opennext-diagnose-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opennext-diagnose-tree
          path: |
            opennext-diagnose/
          retention-days: 7
          if-no-files-found: warn