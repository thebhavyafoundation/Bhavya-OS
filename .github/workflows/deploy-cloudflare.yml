name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── DIAGNOSTIC: test better-sqlite3 native module loading on CI Node ──
      # Temporary step — remove after diagnostic run.
      - name: Diagnostic — test better-sqlite3 native module loading
        run: |
          echo "=== NODE VERSION ==="
          node --version
          echo "=== BETTER-SQLITE3 PACKAGE LOCATION ==="
          ls -la node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3/prebuilds/ 2>/dev/null || echo "No prebuilds dir found at pnpm level"
          ls -la node_modules/better-sqlite3/prebuilds/ 2>/dev/null || echo "No prebuilds dir at top level"
          echo "=== TEST: require('better-sqlite3') ==="
          node -e "
            try {
              const db = require('better-sqlite3');
              console.log('BETTER_SQLITE3_LOAD_OK');
              const instance = db(':memory:');
              console.log('BETTER_SQLITE3_RUNTIME_OK');
              instance.close();
            } catch (e) {
              console.log('BETTER_SQLITE3_LOAD_FAILED');
              console.log('Error name:', e && e.name);
              console.log('Error message:', e && e.message);
              console.log('Error code:', e && e.code);
              if (e && e.stack) console.log(e.stack);
              process.exitCode = 10;
            }
          "
          echo "=== DIAGNOSTIC COMPLETE ==="

      - name: Build for Cloudflare
        if: github.event_name == 'push'
        working-directory: apps/ai-institute
        run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push'
        working-directory: apps/ai-institute
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runtime secrets (TURSO_DATABASE_URL, TURSO_AUTH_TOKEN) must be set
      # manually via: npx wrangler secret put <NAME> --env production
      # These are not needed at build time — only at Worker runtime.
