name: Deploy to Cloudflare Workers

# Canonical production deployment. Cloudflare/OpenNext is the permanent
# production host (docs/architecture/PLATFORM-TRUTH.md). Vercel is preview-only.
on:
  push:
    branches: [master]
    paths:
      - 'apps/ai-institute/**'
      - 'packages/**'
      - 'content/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-cloudflare.yml'
  # Manual trigger for a deliberate production deploy. Prefer this over merging
  # a no-op commit: it makes the deployment an explicit, auditable action.
  workflow_dispatch:

# Do not interrupt an in-flight production deploy. A newer commit queues
# behind it rather than cancelling a half-applied Worker upload.
concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare
        working-directory: apps/ai-institute
        run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to Cloudflare Workers
        working-directory: apps/ai-institute
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runtime secrets (TURSO_DATABASE_URL, TURSO_AUTH_TOKEN) must be set
      # manually via: npx wrangler secret put <NAME> --env production
      # These are not needed at build time — only at Worker runtime.
