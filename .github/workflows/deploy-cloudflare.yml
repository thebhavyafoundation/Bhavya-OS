name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]

jobs:
  # Build is a separate job from upload so the Cloudflare credentials exist
  # only in the job that actually uploads. A failed build must never be able to
  # reach a step holding a production secret.
  build:
    name: Build and verify OpenNext bundle
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Self-test the bundle assertion
        run: node scripts/verify-opennext-bundle.mjs --selftest

      - name: Next.js application build
        # Separated from the OpenNext build so the traced output can be corrected
        # between the two phases. See the Materialise step below.
        run: pnpm --filter ai-institute run build

      - name: Materialise conditional-export targets
        # Next.js output file tracing emits a package main entry but drops the other
        # conditional-export targets. For @libsql/isomorphic-ws@0.1.5 the traced tree keeps
        # node.cjs and omits web.cjs, which the exports map selects under the workerd
        # and default conditions. OpenNext esbuild then resolves the workerd condition
        # and cannot find web.cjs.
        run: node apps/ai-institute/scripts/materialise-conditional-exports.mjs

      - name: Assert conditional-export targets present
        run: node apps/ai-institute/scripts/materialise-conditional-exports.mjs --verify

      - name: Build for Cloudflare
        working-directory: apps/ai-institute
        # pipefail is essential: without it the pipeline's exit status is tee's
        # (always 0), which would mask a build failure and let the deploy step
        # run on a broken bundle.
        #
        # --dangerouslyUseUnsupportedNextVersion: OpenNext refuses to build when
        # the pinned Next.js major is outside the Next.js team's two-year support
        # window. Next 15 was released 2024-10-21, so that window closed on
        # 2026-10-21 and every OpenNext build in this repository began failing
        # with "Next.js version 15.5.25 is not supported by the Next.js team".
        # The check is a build-time gate on the framework's support policy, not a
        # defect in the bundle. Remove this flag once Next is upgraded to 16.x,
        # which is supported until 2027-10-21.
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build --skipNextBuild --dangerouslyUseUnsupportedNextVersion 2>&1 | tee build.log
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Restore pnpm dependency layout in the packaged tree
        # Next.js tracing records the real path of every traced file, so a
        # dependency reached through a pnpm symlink is recorded at the virtual
        # store location and the symlinked private directory next to the
        # requiring package is never reproduced. Node resolves a bare
        # specifier by walking up from the requiring file, so a require of
        # "ws" from the isomorphic-ws node entry cannot resolve. This puts
        # the missing package in the private directory pnpm would create.
        run: node scripts/restore-dependency-layout.mjs apps/ai-institute/.open-next/server-functions/default

      - name: Verify packaged server-function dependencies
        # Fails if any require reachable in the packaged tree cannot resolve.
        run: node scripts/verify-opennext-bundle.mjs

      - name: Record verification
        id: verify
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload OpenNext bundle
        # The deploy job runs in a separate runner, so the compiled OpenNext
        # output has to cross the job boundary. Without this the deploy job
        # starts from a bare checkout and "opennextjs-cloudflare deploy" fails
        # with "Could not find compiled Open Next config". The bundle is only
        # uploaded after the build and the bundle verifier both passed, so the
        # job that holds the production credentials still cannot run on an
        # unverified bundle. The pattern matches the preview workflow.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cloudflare-opennext-bundle
          include-hidden-files: true
          path: apps/ai-institute/.open-next
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cloudflare-build-log
          path: apps/ai-institute/build.log
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    # No credentials are declared anywhere in this job except the upload step,
    # and this job cannot start unless the build and verification both passed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenNext bundle
        # The bundle built and verified by the build job. Downloading it here
        # keeps the production credentials out of the build job while still
        # giving the deploy step the compiled output it requires.
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: cloudflare-opennext-bundle
          path: apps/ai-institute/.open-next

      - name: Deploy to Cloudflare Workers
        working-directory: apps/ai-institute
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        # Runtime secrets (TURSO_DATABASE_URL, TURSO_AUTH_TOKEN) must be set
        # manually via: npx wrangler secret put <NAME> --env production
        # These are not needed at build time — only at Worker runtime.
