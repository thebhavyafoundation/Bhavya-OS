# Canonical Cloudflare/OpenNext preview deployment.
#
# PURPOSE
#   Produce a real, non-production Cloudflare Workers artifact for the exact
#   commit under review, so browser verification is possible against the
#   canonical platform instead of a non-canonical preview.
#
#   Vercel is not canonical and is not consulted here. This workflow deploys
#   through Cloudflare Workers/OpenNext, the same build path production uses.
#
# SAFETY
#   - Deploys to a separate worker, bhavya-foundation-preview. The production
#     worker bhavya-foundation is never targeted.
#   - Uses a separate wrangler config, wrangler.preview.json. The production
#     wrangler.json is not modified or referenced.
#   - No production secrets are exposed. The deploy job holds the Cloudflare
#     credentials and runs only after the build job has succeeded.
#   - No DNS change, no domain change, no production route change.
#   - Runtime secrets are not provisioned on the preview worker. Preview
#     verification therefore covers the public shell and the routes that do not
#     require a live Turso connection.
name: OpenNext Preview Deploy

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "content/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/opennext-preview.yml"
  workflow_dispatch:

concurrency:
  # Shared concurrency group across every workflow that deploys to the
  # canonical preview worker (bhavya-foundation-preview). A per-PR group lets
  # different PRs deploy concurrently to the same shared worker and overwrite
  # each other; a single shared group serializes them. cancel-in-progress:
  # false means an in-progress deployment is never interrupted while it is
  # modifying the shared worker; pending deployments queue and run
  # sequentially, which is the safe behaviour for a shared target.
  group: opennext-preview-shared-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build preview bundle
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record build identity
        # The preview worker is shared between branches, so a deployment from
        # any pull request replaces the previous one. The commit is written
        # into a module in the source tree, which the build inlines into every
        # bundle; without it a verification cannot tell which commit is
        # serving. The value is the public head commit of the pull request.
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node apps/ai-institute/scripts/write-build-identity.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js application build
        # The Next.js build performs output file tracing, so it is separated
        # from the OpenNext build to give the traced output a correction step.
        run: pnpm --filter ai-institute run build

      - name: Materialise conditional-export targets
        # Next.js output file tracing emits a package main entry but drops the
        # other conditional-export targets. For @libsql/isomorphic-ws@0.1.5 the
        # traced tree keeps node.cjs and omits web.cjs, which the exports map
        # selects under the workerd and default conditions. OpenNext esbuild
        # then resolves the workerd condition and cannot find web.cjs.
        run: node apps/ai-institute/scripts/materialise-conditional-exports.mjs

      - name: Assert conditional-export targets present
        run: node apps/ai-institute/scripts/materialise-conditional-exports.mjs --verify

      - name: OpenNext build (no deploy)
        working-directory: apps/ai-institute
        # --skipNextBuild reuses the Next.js build above, whose traced output has
        # already been corrected.
        #
        # --dangerouslyUseUnsupportedNextVersion: OpenNext refuses to build when
        # the pinned Next.js major is outside the Next.js team's two-year support
        # window. Next 15 was released 2024-10-21, so that window closed on
        # 2026-10-21 and every OpenNext build in this repository began failing
        # with "Next.js version 15.5.25 is not supported by the Next.js team".
        # The check is a build-time gate on the framework's support policy, not a
        # defect in the bundle. Remove this flag once Next is upgraded to 16.x,
        # which is supported until 2027-10-21.
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare build --skipNextBuild --dangerouslyUseUnsupportedNextVersion 2>&1 | tee ../../opennext-preview-build.log

      - name: Restore pnpm dependency layout in the packaged tree
        # Next.js tracing records the real path of every traced file, so a
        # dependency reached through a pnpm symlink is recorded at the virtual
        # store location and the symlinked private directory next to the
        # requiring package is never reproduced. Node resolves a bare
        # specifier by walking up from the requiring file, so a require of
        # "ws" from the isomorphic-ws node entry cannot resolve. This puts
        # the missing package in the private directory pnpm would create.
        run: node scripts/restore-dependency-layout.mjs apps/ai-institute/.open-next/server-functions/default

      - name: Verify packaged server-function dependencies
        run: node scripts/verify-opennext-bundle.mjs

      - name: Upload preview bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opennext-preview-bundle
          include-hidden-files: true
          path: apps/ai-institute/.open-next
          retention-days: 1
          if-no-files-found: error

      - name: Upload preview build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opennext-preview-build-log
          path: opennext-preview-build.log
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy preview to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    # Fork pull requests cannot read repository secrets, so the preview worker
    # is only deployed for pull requests raised from this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      url: ${{ steps.record-preview.outputs.url }}
      commit: ${{ steps.record-preview.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download preview bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: opennext-preview-bundle
          path: apps/ai-institute/.open-next

      - name: Deploy preview worker
        working-directory: apps/ai-institute
        # Deploys to bhavya-foundation-preview via wrangler.preview.json. The
        # production worker and its config are not referenced.
        #
        # OPEN_NEXT_DEPLOY tells wrangler that it is being invoked from an
        # OpenNext project, which prevents wrangler from calling back into
        # opennextjs-cloudflare deploy.
        run: npx wrangler deploy --config wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_NEXT_DEPLOY: "true"

      - name: Record preview URL
        id: record-preview
        run: |
          {
            echo "### Preview deployment"
            echo "- worker: bhavya-foundation-preview"
            echo "- commit: ${{ github.sha }}"
            echo "- url: https://bhavya-foundation-preview.thebhavyafoundation.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "url=https://bhavya-foundation-preview.thebhavyafoundation.workers.dev" >> "$GITHUB_OUTPUT"
          echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  verify-preview-identity:
    name: Verify preview build identity
    needs: deploy
    runs-on: ubuntu-latest
    # Always run so a failed or skipped deploy still surfaces an identity
    # problem rather than silently passing.
    if: always()
    steps:
      - name: Verify deployed preview identity
        env:
          EXPECTED_COMMIT: ${{ needs.deploy.outputs.commit }}
          PREVIEW_URL: https://bhavya-foundation-preview.thebhavyafoundation.workers.dev
        run: |
          set -euo pipefail

          IDENTITY_PATH="/api/build-identity"
          MAX_ATTEMPTS=10
          DELAY=5

          if [ -z "${EXPECTED_COMMIT:-}" ]; then
            echo "[verify] No expected commit was supplied (deploy job was skipped or did not run)." >&2
            echo "[verify] Cannot verify preview identity without a reference commit." >&2
            exit 1
          fi

          echo "[verify] Expected commit: ${EXPECTED_COMMIT}"
          echo "[verify] Preview URL: ${PREVIEW_URL}"

          # Wait for the preview to be ready and query the identity endpoint.
          # The endpoint returns 404 when the build recorded no identity, and
          # 200 with the commit/build time when it did. We retry for transient
          # network/propagation delay but fail fast on a permanent mismatch.
          attempt=1
          identity_body=""
          http_code=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "[verify] attempt $attempt of $MAX_ATTEMPTS: ${PREVIEW_URL}${IDENTITY_PATH}"
            response=$(curl -s -w "\n%{http_code}" --max-time 15 "${PREVIEW_URL}${IDENTITY_PATH}" || true)
            http_code=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')

            if [ "$http_code" = "200" ]; then
              identity_body="$body"
              break
            fi

            if [ "$http_code" = "404" ]; then
              echo "[verify] identity endpoint returned 404: build identity is not recorded for this deployment" >&2
              echo "[verify] This means the preview was built without build-identity instrumentation." >&2
              exit 1
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "[verify] failed to get a valid identity response after $MAX_ATTEMPTS attempts (last HTTP $http_code)" >&2
              echo "[verify] Last body: $body" >&2
              exit 1
            fi

            echo "[verify] attempt $attempt failed (HTTP $http_code); retrying in ${DELAY}s" >&2
            sleep "$DELAY"
            attempt=$((attempt + 1))
          done

          # Parse the commit from the JSON body.
          if ! command -v jq >/dev/null 2>&1; then
            echo "[verify] jq is not available; cannot parse identity response" >&2
            exit 1
          fi

          deployed_commit=$(printf '%s' "$identity_body" | jq -r '.commit // empty')
          deployed_short=$(printf '%s' "$identity_body" | jq -r '.shortCommit // empty')
          deployed_built=$(printf '%s' "$identity_body" | jq -r '.builtAt // empty')
          deployed_build_id=$(printf '%s' "$identity_body" | jq -r '.buildId // empty')

          if [ -z "$deployed_commit" ]; then
            echo "[verify] malformed identity response: no commit field" >&2
            echo "[verify] Body: $identity_body" >&2
            exit 1
          fi

          # Compare against the expected commit. For pull_request events,
          # github.sha (recorded by write-build-identity.mjs via GITHUB_SHA) is
          # the merge commit SHA, so the comparison is consistent across
          # pull_request and workflow_dispatch triggers.
          if [ "$deployed_commit" != "$EXPECTED_COMMIT" ]; then
            echo "[verify] IDENTITY MISMATCH" >&2
            echo "[verify] Expected commit: ${EXPECTED_COMMIT}" >&2
            echo "[verify] Deployed commit:  ${deployed_commit}" >&2
            echo "[verify] The preview worker is serving a different commit than intended." >&2
            echo "[verify] Do not trust any behaviour observed on this preview." >&2
            exit 1
          fi

          echo "[verify] IDENTITY OK"
          echo "[verify] Worker: bhavya-foundation-preview"
          echo "[verify] Commit: ${deployed_commit} (${deployed_short})"
          echo "[verify] Built at: ${deployed_built}"
          echo "[verify] Build ID: ${deployed_build_id}"
          echo "[verify] The deployed preview identity matches the expected workflow commit."
