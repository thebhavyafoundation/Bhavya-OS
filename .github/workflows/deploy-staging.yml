name: Deploy to Staging

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'content/**'
      - 'registry/**'
      - 'docker/**'
      - 'terraform/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Rollback to previous version'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"
  DEPLOY_PATH: /opt/bhavya
  DOMAIN: staging.bhavya.foundation

jobs:
  # ----------------------------------------------------------
  # Job 1: Build & Validate
  # ----------------------------------------------------------
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build all apps
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            apps/*/.next/standalone
            apps/*/.next/static
            packages/*/dist
          retention-days: 7

  # ----------------------------------------------------------
  # Job 2: Deploy to Server
  # ----------------------------------------------------------
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rollback == 'false')

    environment:
      name: staging
      url: https://${{ env.DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on server
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && node scripts/backup.js all"

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'backups' \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ deploy@${{ secrets.STAGING_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Install dependencies on server
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && pnpm install --frozen-lockfile"

      - name: Build on server
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && pnpm run build"

      - name: Pull latest Docker images
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && docker compose -f docker/compose.staging.yml pull"

      - name: Build Docker images
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && docker compose -f docker/compose.staging.yml build"

      - name: Rolling restart
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
            docker compose -f docker/compose.staging.yml up -d --no-deps --build website && \
            sleep 10 && \
            docker compose -f docker/compose.staging.yml up -d --no-deps --build admin && \
            sleep 10 && \
            docker compose -f docker/compose.staging.yml up -d --no-deps --build runtime && \
            sleep 5 && \
            docker compose -f docker/compose.staging.yml up -d --no-deps nginx"

      - name: Verify deployment
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.DOMAIN }})
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Deployment failed — website returned $STATUS"
            exit 1
          fi
          echo "✅ Website returned $STATUS"

      - name: Verify health endpoints
        run: |
          for endpoint in / /api/health /admin/api/health; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.DOMAIN }}${endpoint}")
            echo "  ${endpoint}: $STATUS"
          done

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployed commit ${{ github.sha }} to staging"
          echo "URL: https://${{ env.DOMAIN }}"

  # ----------------------------------------------------------
  # Job 3: Rollback
  # ----------------------------------------------------------
  rollback:
    name: Rollback to Previous Version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rollback == 'true'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Execute rollback
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && node scripts/deploy.js production --rollback"

      - name: Verify rollback
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.DOMAIN }})
          echo "Website status after rollback: $STATUS"

      - name: Notify rollback
        if: success()
        run: echo "✅ Rollback completed on staging"
