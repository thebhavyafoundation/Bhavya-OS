name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual escape hatch: allows verifying a branch on demand when push/PR
  # triggers are delayed or suppressed. Runs the same jobs against the
  # selected ref.
  workflow_dispatch:

# Least-privilege token scope. secret-scan's gitleaks-action reads PR
# commits via the API (GET pulls/{n}/commits); without this block the job
# inherits restrictive defaults and fails 403. See run 35315392267.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm antislop
      - run: pnpm lint
      - run: pnpm typecheck

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Secret pattern scan (defense-in-depth)
        run: |
          echo "Scanning for exposed secrets (API keys, tokens, private keys)..."
          # Search tracked files for common secret patterns; fail if found
          if grep -R --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=_archive --exclude-dir=.next -E "(AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|sk_live_[0-9a-zA-Z]{24}|-----BEGIN (RSA|EC|DSA) PRIVATE KEY-----)" .; then
            echo "::error::Potential secret detected — failing CI"
            exit 1
          else
            echo "No secrets detected"
          fi
          # Also ensure no .env files are tracked
          if git ls-files | grep -E "^\.env($|\.)"; then
            echo "::error::.env file tracked in git"
            exit 1
          fi

  platform-contract:
    name: Platform contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Enforces the permanent operating contract:
      #   1. AGENTS.md and docs/architecture/PLATFORM-TRUTH.md exist and hold their invariants
      #   2. Cloudflare R2 is not used anywhere
      #   3. Privileged Backblaze B2 variables never appear in a Client Component
      #   4. No paid-service / payment-method-requiring configuration
      # Dependency-free Node script; no install step needed, so it stays cheap.
      - name: Validate platform contract
        run: node scripts/validate-platform-contract.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
