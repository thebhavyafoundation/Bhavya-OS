# OpenNext production-equivalent build verification.
#
# PURPOSE
#   Reproduce and then gate the exact build that production uses
#   (`opennextjs-cloudflare build`) WITHOUT deploying anything.
#
# WHY THIS EXISTS
#   The normal Next.js build passes while the Cloudflare deployment build fails.
#   The Next.js build does not perform OpenNext's server-function bundling, so a
#   green `build` check does not mean "will deploy". This workflow closes that
#   gap: master can no longer go green and still fail to deploy.
#
# SAFETY
#   - No Cloudflare credentials. No API token. No account id.
#   - No `wrangler deploy`, no `opennextjs-cloudflare deploy`.
#   - No production environment.
#   - No Turso production connection and no database query.
#   - Runs on pull_request and on the repair branch only. Never deploys.
name: OpenNext Build Verify

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "content/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/opennext-build-verify.yml"
  workflow_dispatch:

# Cancel superseded runs on the same PR to save runner time.
concurrency:
  group: opennext-build-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opennext-build:
    name: OpenNext build (no deploy)
    runs-on: ubuntu-latest
    # No `environment:` key, so no production environment approval is possible.
    env:
      # Matches deploy-cloudflare.yml exactly so this gate is representative.
      NODE_OPTIONS: --max-old-space-size=4096
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record toolchain versions
        run: |
          {
            echo "### Toolchain"
            echo "- node: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
            echo "- runner: $(uname -srm)"
            echo "- next: $(node -p "require('./apps/ai-institute/package.json').dependencies.next")"
            echo "- @opennextjs/cloudflare: $(node -p "require('./apps/ai-institute/package.json').devDependencies['@opennextjs/cloudflare']")"
          } >> "$GITHUB_STEP_SUMMARY"
          node -p "require('./apps/ai-institute/package.json').dependencies.next" > opennext-build-versions.txt

      - name: Self-test the bundle assertion
        # Proves the assertion itself detects the production condition before it
        # is trusted to judge a real build. Cheap and deterministic.
        run: node scripts/verify-opennext-bundle.mjs --selftest

      - name: Next.js application build
        run: pnpm --filter ai-institute run build

      - name: Materialise conditional-export targets
        # Next.js output file tracing emits a package main entry but drops the other
        # conditional-export targets. For @libsql/isomorphic-ws@0.1.5 the traced tree keeps
        # node.cjs and omits web.cjs, which the exports map selects under the workerd
        # and default conditions. OpenNext esbuild then resolves the workerd condition
        # and cannot find web.cjs.
        #
        # This must run after the Next.js build, which performs the tracing, and before
        # the OpenNext build, which copies the traced tree and bundles it. The OpenNext
        # build is therefore invoked with --skipNextBuild.
        run: node apps/ai-institute/scripts/materialise-conditional-exports.mjs

      - name: Assert conditional-export targets present
        # Fail fast, at the boundary where the condition can still be corrected,
        # rather than inside the bundler.
        run: node apps/ai-institute/scripts/materialise-conditional-exports.mjs --verify

      - name: OpenNext build only (no upload)
        working-directory: apps/ai-institute
        # Uses the repository-installed binary from node_modules/.bin, not an
        # unpinned remote download. This is the same command production runs,
        # minus the deploy.
        #
        # pipefail is essential. Without it the pipeline's exit status is tee's,
        # which is always 0, so this step reports success even when the build
        # fails. That defect let this gate report green while production's build
        # was failing with the identical error, which is precisely the failure
        # this gate exists to catch.
        #
        # --dangerouslyUseUnsupportedNextVersion: OpenNext refuses to build when
        # the pinned Next.js major is outside the Next.js team's two-year support
        # window. Next 15 was released 2024-10-21, so that window closed on
        # 2026-10-21 and every OpenNext build in this repository began failing
        # with "Next.js version 15.5.25 is not supported by the Next.js team".
        # The check is a build-time gate on the framework's support policy, not a
        # defect in the bundle. Remove this flag once Next is upgraded to 16.x,
        # which is supported until 2027-10-21.
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare build --skipNextBuild --dangerouslyUseUnsupportedNextVersion 2>&1 | tee ../../opennext-build.log

      - name: Restore pnpm dependency layout in the packaged tree
        # Next.js tracing records the real path of every traced file, so a
        # dependency reached through a pnpm symlink is recorded at the virtual
        # store location and the symlinked private directory next to the
        # requiring package is never reproduced. Node resolves a bare
        # specifier by walking up from the requiring file, so a require of
        # "ws" from the isomorphic-ws node entry cannot resolve. This puts
        # the missing package in the private directory pnpm would create.
        run: node scripts/restore-dependency-layout.mjs apps/ai-institute/.open-next/server-functions/default

      - name: Verify packaged server-function dependencies
        run: node scripts/verify-opennext-bundle.mjs

      - name: Upload OpenNext build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opennext-build-log
          path: |
            opennext-build.log
            opennext-build-versions.txt
          retention-days: 7
          if-no-files-found: ignore
