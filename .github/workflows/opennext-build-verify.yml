# Production-equivalent OpenNext build verification.
#
# Runs the exact build production runs, without deploying. The gap this closes:
# `next build` does not perform OpenNext server-function bundling, so a green
# build check never meant "will deploy". That is how three merged PRs passed
# review and failed the deploy.
#
# Safety: no Cloudflare credentials, no account id, no deploy command, no
# production environment, no Turso connection, no database query.
name: OpenNext Build Verify

on:
  pull_request:
    paths:
      - "apps/ai-institute/**"
      - "packages/database/**"
      - "scripts/verify-opennext-bundle.mjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/opennext-build-verify.yml"
  workflow_dispatch:

concurrency:
  group: opennext-build-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opennext-build:
    name: OpenNext build (no deploy)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record toolchain versions
        run: |
          node -p "const p=require('./apps/ai-institute/package.json');['next','@opennextjs/cloudflare','@libsql/client','@libsql/isomorphic-ws','better-sqlite3'].map(k=>k+'='+(p.dependencies?.[k]??p.devDependencies?.[k])).join('\n')" | tee opennext-versions.txt

      - name: Self-test the bundle assertion
        # Proves the assertion detects a broken tree before it judges a real one.
        run: node scripts/verify-opennext-bundle.mjs --selftest

      - name: OpenNext build only (no upload)
        working-directory: apps/ai-institute
        # Byte-identical to the deploy workflow step. Same npx invocation, no
        # preceding `next build`, same pipefail. A gate that is not this exact
        # command cannot verify production.
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee ../../opennext-build.log

      - name: Verify packaged server-function dependencies
        run: node scripts/verify-opennext-bundle.mjs

      - name: Surface the build error
        # GitHub suppresses most log lines in the job UI and artifact download
        # needs credentials, so failures here were undiagnosable and were
        # explained with guesses instead of evidence. An ::error:: command
        # becomes a check annotation, which the REST API returns unauthenticated.
        if: failure()
        run: |
          LOG=opennext-build.log
          if [ -f "$LOG" ]; then
            {
              echo "### OpenNext build failure"
              echo '```'
              grep -n -E "Could not resolve|Cannot find|Module not found|Build failed|ERROR|✘" "$LOG" | head -n 25 || echo "no matching line"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            MSG=$(grep -E "Could not resolve|Cannot find|Module not found|Build failed|✘" "$LOG" | head -n 3 | tr '\n' ' ' | cut -c1-900)
            [ -n "$MSG" ] && echo "::error title=OpenNext build failure::$MSG"
          else
            echo "::error title=OpenNext build failure::no opennext-build.log was produced"
          fi

      - name: Upload OpenNext build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opennext-build-log-${{ github.run_id }}
          path: |
            opennext-build.log
            opennext-versions.txt
          retention-days: 7
          if-no-files-found: ignore
