<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Traditional Himachali stone temple with carvings">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6a9a"/>
      <stop offset="100%" stop-color="#a8c4d8"/>
    </linearGradient>
    <linearGradient id="hStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8070"/>
      <stop offset="100%" stop-color="#5a5040"/>
    </linearGradient>
    <linearGradient id="hRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5560"/>
      <stop offset="100%" stop-color="#2a3540"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#hSky)"/>

  <!-- Distant mountains -->
  <path d="M0 480 L250 300 L450 420 L700 260 L950 400 L1200 280 L1450 380 L1600 320 L1600 600 L0 600 Z" fill="#6a8aaa" opacity="0.5"/>
  <path d="M0 520 L200 380 L400 480 L650 340 L900 460 L1150 360 L1400 440 L1600 380 L1600 640 L0 640 Z" fill="#5a7a6a" opacity="0.6"/>

  <!-- Ground terrace -->
  <path d="M0 700 Q400 660 800 690 T1600 680 L1600 1200 L0 1200 Z" fill="#6a7c52"/>
  <path d="M0 850 Q400 820 800 845 T1600 835 L1600 1200 L0 1200 Z" fill="#4a5a3a"/>

  <!-- Stone plinth -->
  <rect x="500" y="720" width="600" height="80" rx="4" fill="#6a6050"/>
  <rect x="520" y="700" width="560" height="30" fill="#7a7060"/>

  <!-- Temple body -->
  <rect x="560" y="480" width="480" height="240" fill="url(#hStone)"/>

  <!-- Carved pillars -->
  <g fill="#5a5040">
    <rect x="580" y="500" width="36" height="200" rx="4"/>
    <rect x="680" y="500" width="36" height="200" rx="4"/>
    <rect x="884" y="500" width="36" height="200" rx="4"/>
    <rect x="984" y="500" width="36" height="200" rx="4"/>
  </g>
  <!-- Pillar capitals -->
  <g fill="#8a7359">
    <rect x="575" y="495" width="46" height="20" rx="3"/>
    <rect x="675" y="495" width="46" height="20" rx="3"/>
    <rect x="879" y="495" width="46" height="20" rx="3"/>
    <rect x="979" y="495" width="46" height="20" rx="3"/>
  </g>

  <!-- Doorway -->
  <rect x="740" y="540" width="120" height="180" rx="60" fill="#1a1510"/>
  <rect x="755" y="560" width="90" height="160" rx="45" fill="#0e382e" opacity="0.6"/>
  <!-- Torana arch -->
  <path d="M730 540 Q800 480 870 540" stroke="#d4af37" stroke-width="8" fill="none"/>

  <!-- Tiered slate roof -->
  <polygon points="520,480 800,340 1080,480" fill="url(#hRoof)"/>
  <polygon points="560,480 800,360 1040,480" fill="#3a4550"/>
  <polygon points="620,420 800,280 980,420" fill="url(#hRoof)"/>
  <polygon points="660,420 800,300 940,420" fill="#4a5560"/>
  <polygon points="720,340 800,220 880,340" fill="#2a3540"/>
  <polygon points="745,340 800,240 855,340" fill="#3a4550"/>

  <!-- Finial -->
  <rect x="792" y="180" width="16" height="50" fill="#d4af37"/>
  <circle cx="800" cy="175" r="14" fill="#d4af37"/>
  <circle cx="800" cy="175" r="7" fill="#f5e6a8"/>

  <!-- Prayer flags -->
  <g stroke="#8a9a8b" stroke-width="1.5" fill="none">
    <path d="M400 400 Q600 360 800 380"/>
    <path d="M800 380 Q1000 360 1200 400"/>
  </g>
  <g>
    <rect x="450" y="385" width="28" height="20" fill="#c0392b" opacity="0.85"/>
    <rect x="520" y="375" width="28" height="20" fill="#2980b9" opacity="0.85"/>
    <rect x="590" y="368" width="28" height="20" fill="#f1c40f" opacity="0.85"/>
    <rect x="660" y="365" width="28" height="20" fill="#27ae60" opacity="0.85"/>
    <rect x="940" y="365" width="28" height="20" fill="#8e44ad" opacity="0.85"/>
    <rect x="1010" y="370" width="28" height="20" fill="#e67e22" opacity="0.85"/>
    <rect x="1080" y="380" width="28" height="20" fill="#c0392b" opacity="0.85"/>
    <rect x="1150" y="390" width="28" height="20" fill="#2980b9" opacity="0.85"/>
  </g>

  <!-- Foreground stones -->
  <ellipse cx="300" cy="1000" rx="80" ry="40" fill="#5a5550"/>
  <ellipse cx="1350" cy="980" rx="70" ry="35" fill="#5a5550"/>
  <ellipse cx="800" cy="1100" rx="200" ry="50" fill="#4a5a3a" opacity="0.5"/>
</svg>
