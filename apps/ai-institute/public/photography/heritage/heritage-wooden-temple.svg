<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wooden Himachali temple with mountain backdrop">
  <defs>
    <linearGradient id="wSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8ab0"/>
      <stop offset="100%" stop-color="#c8d8e4"/>
    </linearGradient>
    <linearGradient id="wWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a40"/>
      <stop offset="100%" stop-color="#5a4028"/>
    </linearGradient>
    <linearGradient id="wRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a28"/>
      <stop offset="100%" stop-color="#2a1e14"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#wSky)"/>

  <!-- Mountains -->
  <path d="M0 500 L220 320 L400 440 L620 280 L850 420 L1080 300 L1300 400 L1600 300 L1600 620 L0 620 Z" fill="#7a9aaa" opacity="0.55"/>
  <path d="M0 540 L200 400 L380 500 L600 360 L820 480 L1050 380 L1280 460 L1600 380 L1600 660 L0 660 Z" fill="#5a7a6a" opacity="0.65"/>

  <!-- Ground -->
  <path d="M0 720 Q400 680 800 710 T1600 700 L1600 1200 L0 1200 Z" fill="#4a5a3a"/>
  <path d="M0 880 Q400 850 800 875 T1600 865 L1600 1200 L0 1200 Z" fill="#3e4a32"/>

  <!-- Wooden temple structure -->
  <g transform="translate(800,780)">
    <!-- Base -->
    <rect x="-220" y="0" width="440" height="40" fill="#6a6050"/>
    <!-- Main body -->
    <rect x="-180" y="-200" width="360" height="200" fill="url(#wWood)"/>
    <!-- Wood grain lines -->
    <g stroke="#4a3520" stroke-width="1" opacity="0.4">
      <line x1="-180" y1="-160" x2="180" y2="-160"/>
      <line x1="-180" y1="-120" x2="180" y2="-120"/>
      <line x1="-180" y1="-80" x2="180" y2="-80"/>
      <line x1="-180" y1="-40" x2="180" y2="-40"/>
    </g>
    <!-- Carved windows -->
    <rect x="-140" y="-170" width="70" height="90" rx="8" fill="#2a1e14"/>
    <rect x="-125" y="-155" width="40" height="60" rx="4" fill="#d4af37" opacity="0.3"/>
    <rect x="70" y="-170" width="70" height="90" rx="8" fill="#2a1e14"/>
    <rect x="85" y="-155" width="40" height="60" rx="4" fill="#d4af37" opacity="0.3"/>
    <!-- Door -->
    <rect x="-40" y="-130" width="80" height="130" rx="6" fill="#1a120a"/>
    <path d="M-40 -130 Q0 -170 40 -130" fill="#2a1e14"/>
    <!-- Tier 2 -->
    <rect x="-140" y="-320" width="280" height="120" fill="url(#wWood)"/>
    <polygon points="-180,-320 0,-400 180,-320" fill="url(#wRoof)"/>
    <!-- Tier 3 -->
    <rect x="-90" y="-430" width="180" height="110" fill="url(#wWood)"/>
    <polygon points="-130,-430 0,-510 130,-430" fill="url(#wRoof)"/>
    <!-- Spire -->
    <rect x="-8" y="-560" width="16" height="60" fill="#8a7359"/>
    <polygon points="-40,-560 0,-620 40,-560" fill="#d4af37"/>
    <circle cx="0" cy="-625" r="12" fill="#d4af37"/>
  </g>

  <!-- Prayer flags -->
  <g fill="none" stroke="#8a9a8b" stroke-width="1.5">
    <path d="M350 500 Q575 450 800 470"/>
    <path d="M800 470 Q1025 450 1250 500"/>
  </g>
  <g opacity="0.9">
    <polygon points="420,480 450,478 448,500 422,500" fill="#c0392b"/>
    <polygon points="500,465 530,463 528,485 502,485" fill="#2980b9"/>
    <polygon points="580,455 610,453 608,475 582,475" fill="#f1c40f"/>
    <polygon points="660,450 690,449 688,471 662,471" fill="#27ae60"/>
    <polygon points="910,450 940,449 938,471 912,471" fill="#8e44ad"/>
    <polygon points="990,455 1020,454 1018,476 992,476" fill="#e67e22"/>
    <polygon points="1070,465 1100,464 1098,486 1072,486" fill="#c0392b"/>
    <polygon points="1150,480 1180,479 1178,501 1152,501" fill="#2980b9"/>
  </g>

  <!-- Trees -->
  <g fill="#0e382e">
    <path d="M200 900 L220 700 L240 900 Z"/>
    <path d="M280 920 L305 680 L330 920 Z"/>
    <path d="M1320 910 L1345 690 L1370 910 Z"/>
    <path d="M1400 930 L1420 720 L1440 930 Z"/>
  </g>
</svg>
