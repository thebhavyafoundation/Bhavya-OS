<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunlight through cedar forest on a Himalayan slope">
  <defs>
    <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c48a"/>
      <stop offset="35%" stop-color="#8a9a6b"/>
      <stop offset="100%" stop-color="#0e382e"/>
    </linearGradient>
    <linearGradient id="fBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fSun" cx="30%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#f7f0c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="fSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#fSky)"/>
  <rect width="1600" height="1200" fill="url(#fSun)"/>

  <!-- Light beams -->
  <g opacity="0.7">
    <polygon points="350,0 480,0 700,1200 420,1200" fill="url(#fBeam)"/>
    <polygon points="700,0 780,0 980,1200 780,1200" fill="url(#fBeam)" opacity="0.6"/>
    <polygon points="1050,0 1140,0 1380,1200 1140,1200" fill="url(#fBeam)" opacity="0.4"/>
  </g>

  <!-- Distant canopy -->
  <path d="M0 400 Q200 320 400 380 T800 340 T1200 390 T1600 350 L1600 700 L0 700 Z" fill="#1a4532" opacity="0.5" filter="url(#fSoft)"/>

  <!-- Cedar trunks -->
  <g fill="#0a2a21">
    <rect x="120" y="200" width="28" height="1000" rx="4"/>
    <rect x="320" y="150" width="36" height="1050" rx="4"/>
    <rect x="560" y="180" width="32" height="1020" rx="4"/>
    <rect x="820" y="120" width="40" height="1080" rx="4"/>
    <rect x="1100" y="160" width="34" height="1040" rx="4"/>
    <rect x="1380" y="200" width="30" height="1000" rx="4"/>
  </g>

  <!-- Canopy masses -->
  <g fill="#0e382e" opacity="0.75">
    <ellipse cx="134" cy="220" rx="90" ry="140"/>
    <ellipse cx="338" cy="170" rx="110" ry="160"/>
    <ellipse cx="576" cy="200" rx="100" ry="150"/>
    <ellipse cx="840" cy="140" rx="120" ry="170"/>
    <ellipse cx="1117" cy="180" rx="105" ry="155"/>
    <ellipse cx="1395" cy="220" rx="95" ry="145"/>
  </g>

  <!-- Grass slope -->
  <path d="M0 900 Q400 840 800 880 T1600 860 L1600 1200 L0 1200 Z" fill="#3e5240"/>
  <path d="M0 980 Q400 940 800 970 T1600 950 L1600 1200 L0 1200 Z" fill="#263a28"/>

  <!-- Ferns / undergrowth -->
  <g fill="#6a7c52" opacity="0.7">
    <ellipse cx="200" cy="1050" rx="60" ry="20"/>
    <ellipse cx="500" cy="1080" rx="80" ry="24"/>
    <ellipse cx="900" cy="1040" rx="70" ry="22"/>
    <ellipse cx="1300" cy="1070" rx="75" ry="25"/>
  </g>

  <!-- Warm ground light -->
  <ellipse cx="400" cy="920" rx="250" ry="40" fill="#d4af37" opacity="0.12" filter="url(#fSoft)"/>
  <ellipse cx="1100" cy="900" rx="200" ry="35" fill="#d4af37" opacity="0.1" filter="url(#fSoft)"/>
</svg>
