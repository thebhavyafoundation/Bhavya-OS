<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="60%" stop-color="#c9a227" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#sunGradient)"/>
  <circle cx="100" cy="100" r="40" fill="#c9a227" opacity="0.4"/>
  <!-- Sun rays -->
  <g opacity="0.3" stroke="#c9a227" stroke-width="2">
    <line x1="100" y1="20" x2="100" y2="40"/>
    <line x1="100" y1="160" x2="100" y2="180"/>
    <line x1="20" y1="100" x2="40" y2="100"/>
    <line x1="160" y1="100" x2="180" y2="100"/>
    <line x1="43" y1="43" x2="57" y2="57"/>
    <line x1="143" y1="143" x2="157" y2="157"/>
    <line x1="157" y1="43" x2="143" y2="57"/>
    <line x1="43" y1="157" x2="57" y2="143"/>
  </g>
</svg>
