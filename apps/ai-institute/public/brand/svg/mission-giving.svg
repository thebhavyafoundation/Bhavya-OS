<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Giving mission icon -->
  <rect width="80" height="80" rx="16" fill="#fce4ec"/>
  <!-- Heart with hands -->
  <g transform="translate(20, 18)">
    <!-- Heart shape -->
    <path d="M20 35 Q0 20 0 10 Q0 0 10 0 Q15 0 20 8 Q25 0 30 0 Q40 0 40 10 Q40 20 20 35Z" fill="#c9a227" opacity="0.8"/>
    <!-- Hands cupping -->
    <path d="M5 30 Q-5 40 5 48 Q15 55 20 50" stroke="#1a3a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M35 30 Q45 40 35 48 Q25 55 20 50" stroke="#1a3a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Small sparkles -->
    <circle cx="10" cy="8" r="1.5" fill="#fff" opacity="0.8"/>
    <circle cx="30" cy="8" r="1.5" fill="#fff" opacity="0.8"/>
    <circle cx="20" cy="5" r="1" fill="#fff" opacity="0.6"/>
  </g>
</svg>
