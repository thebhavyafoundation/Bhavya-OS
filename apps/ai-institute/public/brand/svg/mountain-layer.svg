<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" fill="none" preserveAspectRatio="xMidYMid slice">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ee"/>
      <stop offset="100%" stop-color="#e8ede6"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1440" height="400" fill="url(#sky)"/>
  
  <!-- Sun glow -->
  <circle cx="720" cy="100" r="200" fill="url(#sunGlow)"/>
  <circle cx="720" cy="100" r="60" fill="#c9a227" opacity="0.3"/>
  
  <!-- Far mountains -->
  <path d="M0 280 L120 200 L200 240 L320 160 L440 220 L520 180 L640 240 L720 140 L800 200 L880 160 L1000 220 L1080 180 L1200 240 L1320 180 L1440 220 L1440 400 L0 400Z" fill="#c5d1bf" opacity="0.6"/>
  
  <!-- Mid mountains -->
