<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Knowledge mission icon -->
  <rect width="80" height="80" rx="16" fill="#e3f2fd"/>
  <!-- Book -->
  <g transform="translate(20, 18)">
    <!-- Book pages -->
    <path d="M0 10 Q20 0 40 10 L40 50 Q20 40 0 50Z" fill="#f5f5f5" stroke="#1a3a2a" stroke-width="1.5"/>
    <path d="M0 10 Q20 20 40 10" stroke="#1a3a2a" stroke-width="1" fill="none"/>
    <!-- Spine -->
    <line x1="20" y1="5" x2="20" y2="55" stroke="#1a3a2a" stroke-width="1"/>
    <!-- Text lines -->
    <line x1="5" y1="18" x2="15" y2="16" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="24" x2="15" y2="22" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
    <line x1="5" y1="30" x2="15" y2="28" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
    <line x1="25" y1="16" x2="35" y2="18" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="22" x2="35" y2="24" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="28" x2="35" y2="30" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Light rays -->
  <g opacity="0.2" stroke="#c9a227" stroke-width="1">
    <line x1="40" y1="5" x2="40" y2="0"/>
    <line x1="50" y1="8" x2="55" y2="3"/>
    <line x1="30" y1="8" x2="25" y2="3"/>
  </g>
</svg>
