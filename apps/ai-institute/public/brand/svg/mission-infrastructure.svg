<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Infrastructure mission icon -->
  <rect width="80" height="80" rx="16" fill="#fff3e0"/>
  <!-- Building -->
  <g transform="translate(18, 15)">
    <!-- Main structure -->
    <rect x="0" y="20" width="44" height="40" fill="#f5f1e6" stroke="#1a3a2a" stroke-width="1.5"/>
    <!-- Roof -->
    <path d="M-4 20 L22 5 L48 20" fill="#c9a227" stroke="#1a3a2a" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="6" y="28" width="8" height="8" fill="#e8f5e9" stroke="#1a3a2a" stroke-width="1"/>
    <rect x="18" y="28" width="8" height="8" fill="#e8f5e9" stroke="#1a3a2a" stroke-width="1"/>
    <rect x="30" y="28" width="8" height="8" fill="#e8f5e9" stroke="#1a3a2a" stroke-width="1"/>
    <!-- Door -->
    <rect x="16" y="44" width="12" height="16" fill="#1a3a2a" rx="6"/>
    <circle cx="25" cy="52" r="1.5" fill="#c9a227"/>
  </g>
  <!-- Trees -->
  <circle cx="12" cy="55" r="8" fill="#3a6b4a" opacity="0.6"/>
  <circle cx="68" cy="55" r="8" fill="#3a6b4a" opacity="0.6"/>
</svg>
