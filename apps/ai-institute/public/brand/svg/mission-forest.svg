  <!-- Trees -->
  <g transform="translate(15, 20)">
    <!-- Tree 1 -->
    <rect x="8" y="30" width="4" height="12" fill="#5a4a3a"/>
    <ellipse cx="10" cy="22" rx="10" ry="10" fill="#2d5a3d"/>
    <ellipse cx="10" cy="18" rx="7" ry="7" fill="#3a6b4a"/>
    
    <!-- Tree 2 -->
    <rect x="28" y="28" width="4" height="14" fill="#5a4a3a"/>
    <ellipse cx="30" cy="18" rx="12" ry="12" fill="#1a3a2a"/>
    <ellipse cx="30" cy="14" rx="9" ry="9" fill="#2d5a3d"/>
    
    <!-- Tree 3 -->
    <rect x="48" y="32" width="4" height="10" fill="#5a4a3a"/>
    <ellipse cx="50" cy="24" rx="9" ry="9" fill="#3a6b4a"/>
    <ellipse cx="50" cy="20" rx="6" ry="6" fill="#4a7d5a"/>
