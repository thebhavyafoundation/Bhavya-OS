  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  
  <!-- Tree leaves -->
  <ellipse cx="65" cy="35" rx="8" ry="12" fill="#22c55e" transform="rotate(-30 65 35)" opacity="0.9"/>
