    <line x1="105" y1="68" x2="105" y2="72"/>
    <line x1="96" y1="64" x2="93" y2="67"/>
    <line x1="92" y1="55" x2="88" y2="55"/>
    <line x1="96" y1="46" x2="93" y2="43"/>
  </g>
