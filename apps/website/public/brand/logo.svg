<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#8a7359"/>
    </linearGradient>
  </defs>
  
  <!-- Tree trunk / B curve -->
  <path d="M120 80 C120 80, 100 40, 130 20 C145 10, 155 15, 150 30 C148 38, 135 50, 128 65" 
        stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Tree leaves (top left cluster) -->
  <ellipse cx="118" cy="25" rx="8" ry="12" fill="#15803d" transform="rotate(-30 118 25)"/>
  <ellipse cx="130" cy="15" rx="7" ry="11" fill="#166534" transform="rotate(-15 130 15)"/>
  <ellipse cx="142" cy="18" rx="6" ry="10" fill="#15803d" transform="rotate(10 142 18)"/>
  <ellipse cx="125" cy="8" rx="5" ry="9" fill="#22c55e" transform="rotate(-20 125 8)"/>
  <ellipse cx="138" cy="5" rx="5" ry="8" fill="#166534" transform="rotate(5 138 5)"/>
  <ellipse cx="115" cy="12" rx="6" ry="10" fill="#15803d" transform="rotate(-40 115 12)"/>
  
  <!-- Main B shape (the large curved B) -->
  <path d="M160 60 
           C160 60, 165 30, 200 20 
           C240 10, 280 30, 290 70 
           C300 110, 280 150, 250 170 
           C280 180, 300 200, 290 240 
           C280 280, 240 310, 200 310 
           C165 310, 160 280, 160 280"
        stroke="#14532d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Mountains inside B -->
  <path d="M185 230 L210 170 L235 210 L250 185 L270 230 Z" 
        fill="url(#mountainGrad)" opacity="0.9"/>
  <path d="M195 230 L220 190 L245 230 Z" 
        fill="#166534" opacity="0.7"/>
  
  <!-- Sun with rays -->
  <circle cx="230" cy="145" r="14" fill="url(#sunGrad)"/>
  <g stroke="#ca8a04" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="230" y1="125" x2="230" y2="118"/>
    <line x1="244" y1="131" x2="249" y2="126"/>
    <line x1="250" y1="145" x2="257" y2="145"/>
    <line x1="244" y1="159" x2="249" y2="164"/>
    <line x1="230" y1="165" x2="230" y2="172"/>
    <line x1="216" y1="159" x2="211" y2="164"/>
    <line x1="210" y1="145" x2="203" y2="145"/>
    <line x1="216" y1="131" x2="211" y2="126"/>
  </g>
  
  <!-- Open book at bottom -->
  <path d="M175 280 C175 280, 200 290, 200 295 C200 290, 225 280, 225 280" 
        stroke="url(#bookGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M175 280 C175 280, 155 275, 145 278" 
        stroke="url(#bookGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M225 280 C225 280, 245 275, 255 278" 
        stroke="url(#bookGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- BHAVYA text -->
  <text x="200" y="360" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="48" font-weight="400" letter-spacing="12" fill="#14532d">
    BHAVYA
  </text>
  
  <!-- FOUNDATION text -->
  <text x="200" y="385" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="16" font-weight="400" letter-spacing="8" fill="#ca8a04">
    FOUNDATION
  </text>
  
  <!-- Decorative lines around FOUNDATION -->
  <line x1="95" y1="380" x2="135" y2="380" stroke="#ca8a04" stroke-width="1" opacity="0.6"/>
  <line x1="265" y1="380" x2="305" y2="380" stroke="#ca8a04" stroke-width="1" opacity="0.6"/>
  
  <!-- Tagline -->
  <text x="200" y="415" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="11" font-weight="400" letter-spacing="4" fill="#8a7359">
    NATURE. KNOWLEDGE. HERITAGE.
  </text>
  
  <!-- Small leaf motif -->
  <g transform="translate(200, 440)">
    <ellipse cx="-6" cy="-3" rx="4" ry="7" fill="#15803d" transform="rotate(-20 -6 -3)"/>
    <ellipse cx="6" cy="-3" rx="4" ry="7" fill="#15803d" transform="rotate(20 6 -3)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="6" fill="#22c55e"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
