<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="mg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#22c55e" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  
  <!-- Logo mark (left side) -->
  <g transform="translate(120, 140) scale(2.5)">
    <!-- Tree leaves -->
    <ellipse cx="18" cy="6" rx="4" ry="6" fill="#22c55e" transform="rotate(-30 18 6)" opacity="0.8"/>
    <ellipse cx="24" cy="3" rx="3.5" ry="5.5" fill="#4ade80" transform="rotate(-15 24 3)" opacity="0.7"/>
    <ellipse cx="30" cy="4" rx="3" ry="5" fill="#22c55e" transform="rotate(10 30 4)" opacity="0.8"/>
    
    <!-- B shape -->
    <path d="M24 12 C24 12, 25 5, 32 3 C39 1, 47 5, 49 12 C51 19, 47 26, 42 30 C47 32, 51 36, 49 42 C47 48, 39 52, 32 52 C25 52, 24 48, 24 48"
          stroke="#bbf7d0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mountains -->
    <path d="M29 42 L34 30 L39 38 L42 33 L47 42 Z" fill="#22c55e" opacity="0.5"/>
    
    <!-- Sun -->
    <circle cx="38" cy="22" r="4" fill="#ca8a04"/>
  </g>
  
  <!-- Text content (right side) -->
  <text x="520" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" letter-spacing="8" fill="#f0fdf4">
    BHAVYA
  </text>
  <text x="520" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" letter-spacing="12" fill="#ca8a04">
    FOUNDATION
  </text>
  
  <!-- Tagline -->
  <text x="520" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" letter-spacing="6" fill="#86efac" opacity="0.8">
    NATURE. KNOWLEDGE. HERITAGE.
  </text>
  
  <!-- Description -->
  <text x="520" y="420" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#bbf7d0" opacity="0.7">
    Building institutions for generations.
  </text>
  
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#052e16" opacity="0.5"/>
  <text x="600" y="612" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#86efac" opacity="0.6">
    bhavya.foundation
  </text>
</svg>
