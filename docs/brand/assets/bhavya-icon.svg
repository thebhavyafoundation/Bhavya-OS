<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a3a2a"/>
  
  <!-- Tree trunk -->
  <rect x="95" y="110" width="10" height="50" fill="#c9a227"/>
  
  <!-- Tree branches -->
  <path d="M100 110 L70 80 M100 110 L130 80 M100 95 L80 70 M100 95 L120 70" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Leaves -->
  <circle cx="70" cy="75" r="12" fill="#4a7c59"/>
  <circle cx="130" cy="75" r="12" fill="#4a7c59"/>
  <circle cx="80" cy="60" r="10" fill="#8fbc8f"/>
  <circle cx="120" cy="60" r="10" fill="#8fbc8f"/>
  <circle cx="100" cy="50" r="15" fill="#c9a227"/>
  
  <!-- Sun behind tree -->
  <circle cx="100" cy="45" r="20" fill="#c9a227" opacity="0.6"/>
  
  <!-- Book at bottom -->
  <rect x="75" y="145" width="50" height="10" rx="3" fill="#c9a227"/>
  <line x1="100" y1="145" x2="100" y2="155" stroke="#1a3a2a" stroke-width="1.5"/>
</svg>
