# ============================================================
# Cloud-Init — Server Setup Script
# Runs on first boot to prepare the server for deployment
# ============================================================

#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - nginx
  - certbot
  - python3-certbot-nginx
  - curl
  - jq
  - git
  - htop
  - ufw

# Create deploy user
users:
  - name: deploy
    groups: sudo, docker
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ssh-rsa AAAA... # Will be replaced by Terraform

# Docker config
write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }

  - path: /etc/nginx/sites-available/default
    content: |
      server {
          listen 80;
          server_name _;
          
          location /.well-known/acme-challenge/ {
              root /var/www/certbot;
          }
          
          location / {
              return 301 https://$host$request_uri;
          }
      }

# Run commands
runcmd:
  # Enable Docker
  - systemctl enable docker
  - systemctl start docker
  
  # Configure firewall
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  
  # Create directories
  - mkdir -p /var/www/certbot
  - mkdir -p /opt/bhavya
  - mkdir -p /opt/bhavya/backups
  - mkdir -p /opt/bhavya/logs
  
  # Create swap (2GB)
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  
  # Set up log rotation
  - |
    cat > /etc/logrotate.d/bhavya << 'EOF'
    /opt/bhavya/logs/*.log {
        daily
        missingok
        rotate 14
        compress
        delaycompress
        notifempty
        create 0640 deploy deploy
    }
    EOF
